# Builds each app's image, starts its docker-compose.yml (app + MySQL + Caddy) and checks that
# the first run works, then publishes it to GHCR (main branch and version tags only).
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [pulse, darts, household]
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --build-arg APP=${{ matrix.app }} -t devquake-${{ matrix.app }}:ci .

      - name: Start the Compose stack with it
        working-directory: apps/${{ matrix.app }}
        run: |
          cat > ci.override.yml <<YAML
          services:
            app:
              image: devquake-${{ matrix.app }}:ci
          YAML
          docker compose -f docker-compose.yml -f ci.override.yml up -d

      - name: First run works (health, setup page, sign-in gate)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/_health; then break; fi
            sleep 3
          done
          curl -fsS http://localhost/api/_health
          curl -fsS http://localhost/instance/setup | grep -q 'name="password"'
          # Before setup, every page leads to the setup page.
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost/)" != ""

      - name: Logs
        if: always()
        working-directory: apps/${{ matrix.app }}
        run: docker compose -f docker-compose.yml -f ci.override.yml logs --no-color app db | tail -200

      - name: Publish to GHCR
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/devquake-${{ matrix.app }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The app's own version (bundles like Household), else its one plugin's.
          VERSION=$(node -p "const a = require('./apps/${{ matrix.app }}/app.json'); a.version || require('./vendor/plugins/' + a.plugins[0] + '/package.json').version")
          for TAG in latest "$VERSION" "sha-${GITHUB_SHA::7}"; do
            docker tag devquake-${{ matrix.app }}:ci "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
