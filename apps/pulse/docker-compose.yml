# Pulse, self-hosted (DevQuake). https://github.com/lorikr6-cell/devquake-selfhost
# Deploy on Hostinger, or anywhere with Docker: docker compose up -d
# Every variable has a default; set your own in the host's Docker Manager or a .env file next to
# this one (see .env.example). Generated by scripts/generate-apps.mjs: edit app.json instead.
name: devquake-pulse

services:
  app:
    image: ghcr.io/lorikr6-cell/devquake-pulse:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DOMAIN: ${DOMAIN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DB_NAME: ${DB_NAME:-pulse}
      DB_USER: ${DB_USER:-pulse}
      DB_PASSWORD: ${DB_PASSWORD:-pulse-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      SHOW_POWERED_BY: ${SHOW_POWERED_BY:-true}
      APP_SECRET: ${APP_SECRET:-}
      PULSE_MASTER_KEY: ${PULSE_MASTER_KEY:-}
      PULSE_DEFAULT_PLAN: ${PULSE_DEFAULT_PLAN:-full}
      PULSE_MAX_STREAMS: ${PULSE_MAX_STREAMS:-500}
    volumes:
      - app-data:/data

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pulse}
      MYSQL_USER: ${DB_USER:-pulse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pulse-change-me}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # HTTPS by itself once DOMAIN is set and pointed at the server; plain HTTP on port 80 until then.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    command: caddy reverse-proxy --from ${DOMAIN:-:80} --to app:3000
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data

volumes:
  app-data:
  db-data:
  caddy-data:
