# Household, self-hosted (DevQuake). https://github.com/lorikr6-cell/devquake-selfhost
# Deploy on Hostinger, or anywhere with Docker: docker compose up -d
# Every variable has a default; set your own in the host's Docker Manager or a .env file next to
# this one (see .env.example). Generated by scripts/generate-apps.mjs: edit app.json instead.
name: devquake-household

services:
  app:
    image: ghcr.io/lorikr6-cell/devquake-household:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DOMAIN: ${DOMAIN:-}
      PUBLIC_IP: ${PUBLIC_IP:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DB_NAME: ${DB_NAME:-household}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      SHOW_POWERED_BY: ${SHOW_POWERED_BY:-true}
      APP_SECRET: ${APP_SECRET:-}
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-household-change-me}
    volumes:
      - app-data:/data

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-household}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-household-change-me}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The home and every app on its own name, with HTTPS, from DOMAIN (or PUBLIC_IP's sslip.io
  # names); anything else (the bare IP) over plain HTTP, where the home explains what to set.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-}
      PUBLIC_IP: ${PUBLIC_IP:-}
      APPS: expenses utilities shopping cookbook meals
    command:
      - sh
      - -c
      - |
        D="$$DOMAIN"
        if [ -z "$$D" ] && [ -n "$$PUBLIC_IP" ]; then D="$$(echo "$$PUBLIC_IP" | tr . -).sslip.io"; fi
        : > /etc/caddy/Caddyfile
        if [ -n "$$D" ]; then
          H="$$D"; for a in $$APPS; do H="$$H, $$a.$$D"; done
          printf '%s {\n\treverse_proxy app:3000\n}\n' "$$H" >> /etc/caddy/Caddyfile
        fi
        printf ':80 {\n\treverse_proxy app:3000\n}\n' >> /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data

volumes:
  app-data:
  db-data:
  caddy-data:
